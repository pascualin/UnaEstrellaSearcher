<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Config Studio · Base de datos</title>
  <link rel="stylesheet" href="/config_ui.css" />
</head>
<body class="app-page">
  <div class="layout app-layout">
    <aside class="app-sidebar">
      <div class="brand app-brand">Humorous Review Scout</div>
      <nav>
        <a class="nav-item" href="/config">Configuración</a>
        <a class="nav-item" href="/run">Ejecución en vivo</a>
        <a class="nav-item" href="/import-review">Importar reseña</a>
        <a class="nav-item active" href="/db">Base de datos</a>
      </nav>
      <div class="actions side-actions app-sidebar-actions">
        <button class="secondary" id="db-refresh">Actualizar</button>
      </div>
    </aside>
    <div class="content">
      <header class="app-header">
        <div class="app-eyebrow">Moderación</div>
        <h1>Base de datos</h1>
        <p>Revisa los sitios encontrados y modera juntas todas sus reseñas analizadas.</p>
      </header>
      <main>
        <section id="db-view" class="view active">
          <div class="card app-card db-grid">
            <div class="row app-toolbar" style="align-items: center;">
              <div>
                <h2>Resumen</h2>
                <p class="hint">Resumen de ingestión y contenido.</p>
              </div>
              <div class="db-controls app-filter-bar" style="margin-left: auto;">
                <label class="hint" for="review-sort">Ordenar por</label>
                <select id="review-sort">
                  <option value="humor_score">Puntuación de humor</option>
                  <option value="updated_at">Última actualización</option>
                </select>
                <label class="hint" for="status-filter">Estado</label>
                <select id="status-filter">
                  <option value="pending">Vacío</option>
                  <option value="accepted">Aceptada</option>
                  <option value="rejected">Rechazada</option>
                  <option value="all">Todas</option>
                </select>
              </div>
            </div>
            <div class="db-summary" id="db-summary"></div>
            <div class="db-section">
              <h3>Sitios</h3>
              <div class="place-results" id="db-places"></div>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>
  <script>
    const byId = (id) => document.getElementById(id);
    const reviewSort = byId("review-sort");
    const statusFilter = byId("status-filter");
    const SESSION_KEYS = {
      reviewSort: "db.reviewSort",
      statusFilter: "db.statusFilter",
    };

    function loadFilterState() {
      const storedSort = sessionStorage.getItem(SESSION_KEYS.reviewSort);
      if (storedSort) {
        reviewSort.value = storedSort;
      }
      const storedStatus = sessionStorage.getItem(SESSION_KEYS.statusFilter);
      if (storedStatus) {
        statusFilter.value = storedStatus;
      }
    }

    function persistFilterState() {
      sessionStorage.setItem(SESSION_KEYS.reviewSort, reviewSort.value);
      sessionStorage.setItem(SESSION_KEYS.statusFilter, statusFilter.value);
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>'"]/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "'": "&#39;",
        '"': "&quot;",
      })[char]);
    }

    function renderPlaces(container, rows) {
      if (!rows || rows.length === 0) {
        container.innerHTML = "<div class='place-results-empty'>No hay sitios con reseñas para este filtro.</div>";
        return;
      }
      container.innerHTML = rows.map((row) => {
        const name = escapeHtml(row.place_name || "Sitio");
        const address = escapeHtml(row.place_address || "Sin dirección");
        const category = escapeHtml(row.place_category || "Lugar");
        const placeId = escapeHtml(row.place_id || "");
        return `
          <article class="place-result-card" data-place-id="${placeId}" tabindex="0" role="link">
            <div class="place-result-score" aria-label="Puntuación máxima de humor">
              <strong>${Number(row.top_humor_score || 0)}</strong>
              <span>mejor humor</span>
            </div>
            <div class="place-result-copy">
              <div class="place-result-heading">
                <h4>${name}</h4>
                <span>${Number(row.review_count || 0)} reseñas</span>
              </div>
              <p>${category} · ${address}</p>
              <div class="place-result-counts" aria-label="Estados de las reseñas">
                <span class="is-pending">${Number(row.pending_count || 0)} vacías</span>
                <span class="is-accepted">${Number(row.accepted_count || 0)} aceptadas</span>
                <span class="is-rejected">${Number(row.rejected_count || 0)} rechazadas</span>
              </div>
            </div>
            <span class="place-result-open" aria-hidden="true">›</span>
          </article>`;
      }).join("");
    }

    async function loadDb() {
      const res = await fetch(`/api/db-data?sort=${encodeURIComponent(reviewSort.value)}&status=${encodeURIComponent(statusFilter.value)}`);
      if (!res.ok) {
        byId("db-summary").innerHTML = "<div class='hint'>No se pudo cargar la base de datos.</div>";
        return;
      }
      const payload = await res.json();
      const summary = payload.summary || {};
      byId("db-summary").innerHTML = [
        `<div class=\"db-summary-card\"><div class=\"label\">Sitios</div><div class=\"value\">${summary.places || 0}</div></div>`,
        `<div class=\"db-summary-card\"><div class=\"label\">Reseñas</div><div class=\"value\">${summary.reviews || 0}</div></div>`,
        `<div class=\"db-summary-card\"><div class=\"label\">Vacías</div><div class=\"value\">${summary.pending || 0}</div></div>`,
        `<div class=\"db-summary-card\"><div class=\"label\">Aceptadas</div><div class=\"value\">${summary.accepted || 0}</div></div>`,
        `<div class=\"db-summary-card\"><div class=\"label\">Rechazadas</div><div class=\"value\">${summary.rejected || 0}</div></div>`,
        `<div class=\"db-summary-card\"><div class=\"label\">Reseñas vacías (última)</div><div class=\"value\">${summary.empty_reviews_skipped_last || 0}</div></div>`,
        `<div class=\"db-summary-card\"><div class=\"label\">Reseñas vacías (total)</div><div class=\"value\">${summary.empty_reviews_skipped_total || 0}</div></div>`,
      ].join("");
      renderPlaces(byId("db-places"), payload.places || []);
      document.querySelectorAll(".place-result-card").forEach((card) => {
        const openPlace = () => {
          const placeId = card.dataset.placeId;
          if (placeId) window.location.href = `/place?id=${encodeURIComponent(placeId)}`;
        };
        card.addEventListener("click", openPlace);
        card.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            openPlace();
          }
        });
      });
    }

    byId("db-refresh").addEventListener("click", loadDb);
    reviewSort.addEventListener("change", () => {
      persistFilterState();
      loadDb();
    });
    statusFilter.addEventListener("change", () => {
      persistFilterState();
      loadDb();
    });
    loadFilterState();
    loadDb();
  </script>
</body>
</html>
