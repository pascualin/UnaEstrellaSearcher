<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Config Studio · Importar reseña</title>
  <link rel="stylesheet" href="/config_ui.css" />
</head>
<body class="app-page">
  <div class="layout app-layout">
    <aside class="app-sidebar">
      <div class="brand app-brand">Humorous Review Scout</div>
      <nav>
        <a class="nav-item" href="/config">Configuración</a>
        <a class="nav-item" href="/run">Ejecución en vivo</a>
        <a class="nav-item active" href="/import-review">Importar reseña</a>
        <a class="nav-item" href="/db">Base de datos</a>
      </nav>
    </aside>
    <div class="content">
      <header class="app-header">
        <div class="app-eyebrow">Manual</div>
        <h1>Importar reseñas</h1>
      </header>
      <main>
        <section class="view active">
          <div class="config-dashboard">
            <div class="config-column">
              <div class="card app-card app-card-accent">
                <h2>Enlace de Google Maps</h2>
                <div class="import-review-stack">
                  <div class="compact-field compact-field--full">
                    <label for="import-review-url">Enlace de la reseña</label>
                    <input id="import-review-url" type="url" placeholder="https://www.google.com/maps/reviews/..." />
                  </div>
                  <div class="compact-field compact-field--full">
                    <label for="import-review-submitted-by">Quién nos envía la reseña</label>
                    <input id="import-review-submitted-by" type="text" placeholder="Álvaro" />
                  </div>
                  <div class="actions import-review-actions">
                    <button id="import-review-url-button" type="button">Analizar reseña y sitio</button>
                  </div>
                  <div class="hint inline-feedback" id="import-review-url-result" role="status" aria-live="polite"></div>
                  <a class="place-link-button" id="import-place-link" target="_blank" rel="noopener" hidden>Revisar reseñas del sitio</a>
                </div>
              </div>
            </div>
            <div class="config-column">
              <div class="card app-card">
                <h2>Capturas</h2>
                <div class="import-review-stack">
                  <div class="import-paste-zone" id="import-paste-zone" tabindex="0">
                    <strong>Pega aquí una o varias capturas</strong>
                  </div>
                  <div class="hint inline-feedback" id="import-review-image-name"></div>
                  <div class="actions import-review-actions">
                    <button class="secondary" id="clear-import-images" type="button">Limpiar capturas</button>
                    <button id="import-review-button" type="button">Importar desde captura</button>
                  </div>
                  <div class="hint inline-feedback" id="import-review-result" role="status" aria-live="polite"></div>
                </div>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>
  <script src="/config_ui.js"></script>
</body>
</html>
