<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Config Studio · Configuración</title>
  <link rel="stylesheet" href="/config_ui.css" />
</head>
<body class="app-page">
  <div class="layout app-layout">
    <aside class="app-sidebar">
      <div class="brand app-brand">Humorous Review Scout</div>
      <nav>
        <a class="nav-item active" href="/config">Configuración</a>
        <a class="nav-item" href="/run">Ejecución en vivo</a>
        <a class="nav-item" href="/import-review">Importar reseña</a>
        <a class="nav-item" href="/db">Base de datos</a>
      </nav>
      <div class="actions side-actions app-sidebar-actions">
        <button id="save">Guardar cambios</button>
        <div class="banner" id="status"></div>
      </div>
    </aside>
    <div class="content">
      <header class="app-header">
        <div class="app-eyebrow">Control</div>
        <h1>Configuración</h1>
        <p>Edita el pipeline y ajusta discovery.</p>
      </header>
      <main>
        <section id="config-view" class="view active">
          <div class="config-dashboard">
            <div class="config-column">
              <div class="card app-card">
                <h2>Aplicación</h2>
                <div class="compact-form-grid compact-form-grid--triple">
                  <div class="compact-field">
                    <label>Umbral de humor</label>
                    <input id="humor_threshold" type="number" min="0" max="100" />
                  </div>
                  <div class="compact-field">
                    <label>Máx. reseñas por sitio</label>
                    <input id="max_reviews_per_place" type="number" min="1" />
                  </div>
                  <div class="compact-field">
                    <label>Máx. sitios por ejecución</label>
                    <input id="max_places_per_run" type="number" min="1" />
                  </div>
                </div>
              </div>

              <div class="card app-card">
                <h2 id="scoring-heading">Puntuación</h2>
                <div class="compact-form-grid">
                  <div class="compact-field">
                    <label>Proveedor</label>
                    <select id="scoring_provider">
                      <option value="openai">OpenAI</option>
                      <option value="typesafe">TypeSafe (Jev)</option>
                    </select>
                  </div>
                  <div class="compact-field">
                    <label>Modelo</label>
                    <select id="scoring_model"></select>
                    <div class="field-note" id="scoring-model-status" aria-live="polite"></div>
                  </div>
                  <div class="compact-field compact-field--full">
                    <label>Variable de API key</label>
                    <input id="scoring_api_key_env" type="text" />
                  </div>
                  <div class="compact-field" id="reasoning-effort-field" hidden>
                    <label>Esfuerzo de razonamiento</label>
                    <select id="scoring_reasoning_effort"></select>
                  </div>
                  <div class="compact-field" id="reasoning-mode-field" hidden>
                    <label>Modo de razonamiento</label>
                    <select id="scoring_reasoning_mode"></select>
                  </div>
                  <div class="compact-field" id="verbosity-field" hidden>
                    <label>Verbosidad</label>
                    <select id="scoring_verbosity"></select>
                  </div>
                  <div class="compact-field" id="service-tier-field" hidden>
                    <label>Nivel de servicio</label>
                    <select id="scoring_service_tier"></select>
                  </div>
                  <div class="compact-field" id="temperature-field" hidden>
                    <label>Temperatura</label>
                    <input id="scoring_temperature" type="number" min="0" max="2" step="0.1" />
                  </div>
                  <div class="compact-field" id="max-output-tokens-field" hidden>
                    <label>Máx. tokens de salida</label>
                    <input id="scoring_max_output_tokens" type="number" min="320" step="1" />
                  </div>
                  <div class="compact-field compact-field--full">
                    <label>Criterios de puntuación</label>
                    <textarea id="prompt"></textarea>
                  </div>
                </div>
              </div>
            </div>

            <div class="config-column">
              <div class="card app-card">
                <h2>Descubrimiento</h2>
                <div class="compact-form-grid compact-form-grid--split">
                  <div class="compact-field">
                    <label>País</label>
                    <input id="country" type="text" />
                  </div>
                  <div class="compact-field">
                    <label>Reseñas mínimas en el sitio</label>
                    <input id="min_total_reviews" type="number" min="0" />
                  </div>
                  <div class="compact-field compact-field--full">
                    <label>El nombre contiene</label>
                    <input id="name_contains" type="text" />
                  </div>
                  <div class="compact-field">
                    <label>Regiones (una por línea, opcional)</label>
                    <textarea id="regions"></textarea>
                  </div>
                  <div class="compact-field">
                    <label>Categorías (una por línea)</label>
                    <textarea id="categories"></textarea>
                  </div>
                </div>
              </div>

            </div>
          </div>
        </section>
      </main>
    </div>
  </div>
  <div class="modal" id="no-results-modal" aria-hidden="true">
    <div class="modal-card">
      <h2>Sin resultados</h2>
      <p class="hint" id="no-results-text">No se encontraron resultados para esa búsqueda.</p>
      <div class="actions">
        <button class="secondary" id="no-results-close">Cerrar</button>
      </div>
    </div>
  </div>
  <script src="/config_ui.js"></script>
</body>
</html>
